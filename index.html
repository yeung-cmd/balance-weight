<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E2761">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="天平量度重量">
<title>天平量度重量</title>
<style>
:root{
  --navy:#1E2761; --coral:#F96167; --teal:#1C7293; --gold:#F9E795;
  --ok:#2e8b3e; --okbg:#e3f5e1; --bad:#c62828; --badbg:#fde4e4;
  --kai:"DFKai-SB","BiauKai","標楷體","Kaiti TC","STKaiti","KaiTi","TW-Kai",serif;
  --num:"Arial Rounded MT Bold","Arial","Helvetica",sans-serif;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#20253a;overflow:hidden;font-family:var(--kai)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:0 0;position:absolute;left:0;top:0;overflow:hidden;background:#ddd6c6}
/* top bar */
#topbar{position:absolute;left:0;top:0;width:1600px;height:70px;background:linear-gradient(#26306f,var(--navy));display:flex;align-items:center;padding:0 16px;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.35);z-index:20}
#topbar h1{color:#fff;font-size:30px;margin:0 14px 0 4px;font-weight:bold;letter-spacing:2px;white-space:nowrap}
.tab{font-family:var(--kai);font-size:26px;padding:8px 18px;border-radius:12px;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-weight:bold}
.tab.on{background:var(--gold);color:var(--navy)}
.tool{font-family:var(--kai);font-size:22px;padding:8px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer}
.spacer{flex:1}
/* shelf */
#shelf{position:absolute;left:0;top:70px;width:300px;height:830px;background:linear-gradient(90deg,#f3efe6,#e8e1d2);border-right:3px solid #b9ac93;z-index:10;display:flex;flex-direction:column}
#cats{display:flex;gap:6px;padding:10px 8px 6px}
.cat{flex:1;font-family:var(--kai);font-size:23px;font-weight:bold;padding:8px 0;border-radius:10px;border:2px solid var(--teal);background:#fff;color:var(--teal);cursor:pointer}
.cat.on{background:var(--teal);color:#fff}
#grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:128px;gap:8px;padding:6px 10px 10px;overflow:hidden}
.card{position:relative;background:#fff;border-radius:14px;box-shadow:0 2px 5px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 4px 6px;cursor:grab;touch-action:none;border:3px solid transparent}
.card img{max-width:110px;max-height:78px;object-fit:contain;flex:1;min-height:0;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.card span{font-size:24px;font-weight:bold;color:#222;margin-top:2px}
.card.used{opacity:.3;cursor:default}
.card .wt{position:absolute;right:5px;top:4px;font-family:var(--num);font-size:15px;background:var(--gold);color:var(--navy);border-radius:8px;padding:1px 6px;display:none}
body.showw .card .wt{display:block}
#shelfHint{font-size:18px;color:#6b604c;text-align:center;padding:0 8px 10px;line-height:1.3}
/* scene */
#bg,#fg{position:absolute;left:300px;top:70px;width:1300px;height:830px}
#fg{overflow:visible;touch-action:none;z-index:5}
/* hud */
#side{position:absolute;left:1104px;top:82px;width:484px;display:flex;flex-direction:column;gap:12px;z-index:8}
#hud{background:rgba(255,255,255,.93);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:14px 18px;z-index:8;min-height:120px;border-left:10px solid var(--teal)}
#status{font-size:29px;font-weight:bold;color:#222;line-height:1.35}
#status .ok{color:var(--ok)} #status .warn{color:var(--bad)}
#eq{margin-top:8px;font-family:var(--num);font-size:40px;font-weight:bold;color:var(--navy);min-height:0;white-space:nowrap}
#eq .p{opacity:0;transition:opacity .45s}
#eq .p.show{opacity:1}
#eq .tot{color:var(--bad)}
#result{font-size:34px;font-weight:bold;color:var(--bad);margin-top:4px;min-height:0}
/* mode panel */
#panel{background:rgba(255,255,255,.93);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:14px 18px;z-index:8;border-left:10px solid var(--coral)}
#panel h2{margin:0 0 8px;font-size:28px;color:var(--navy)}
.btn{font-family:var(--kai);font-size:26px;font-weight:bold;padding:10px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--navy);color:#fff;margin:4px 4px 4px 0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--teal)} .btn.cor{background:var(--coral)} .btn.gold{background:var(--gold);color:var(--navy)}
.btn.sel{outline:5px solid var(--gold)}
.btn[disabled]{opacity:.4}
.steps{list-style:none;margin:0;padding:0}
.steps li{font-size:23px;line-height:1.35;padding:5px 8px;border-radius:10px;color:#777;margin-bottom:3px}
.steps li.on{background:var(--gold);color:var(--navy);font-weight:bold}
.steps li.done{color:#2e7d32}
.hint{font-size:24px;font-weight:bold;color:var(--bad);margin:8px 0 4px;line-height:1.35;min-height:32px}
.small{font-size:20px;color:#555;line-height:1.4}
#keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
#keypad button{font-family:var(--num);font-size:30px;font-weight:bold;height:54px;border-radius:10px;border:2px solid #bbb;background:#fff;cursor:pointer}
#keypad button.k2{font-family:var(--kai);font-size:22px;background:#eef}
#ansBox{font-family:var(--num);font-size:40px;font-weight:bold;color:var(--navy);background:#fff;border:3px solid var(--teal);border-radius:10px;padding:2px 12px;display:inline-block;min-width:110px;text-align:center}
/* package mode */
#packs{position:absolute;left:0;top:70px;width:1600px;height:830px;z-index:9;display:none}
#packs svg{position:absolute;inset:0}
/* modal */
.modal{position:absolute;inset:0;background:rgba(10,15,40,.55);z-index:50;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:20px;padding:22px 28px;width:1000px;max-height:820px;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.sheet h2{margin:0 0 12px;color:var(--navy);font-size:34px}
table.rec{width:100%;border-collapse:collapse;font-size:26px}
table.rec th{background:var(--navy);color:#fff;padding:8px}
table.rec td{border:2px solid #ccd;padding:6px 10px;text-align:center}
table.rec td.f{font-family:var(--num)}
.set-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px}
.set-grid label{font-size:22px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:8px;background:#f5f5fa}
.set-grid input{width:84px;font-size:22px;font-family:var(--num);padding:3px 6px;text-align:right}
.set-grid label.err{background:#fde4e4}
.lockbox{border:3px dashed var(--navy);border-radius:14px;padding:14px 18px;background:#f5f5fa}
.lockbox .lt{font-size:28px;font-weight:bold;color:var(--navy)}
#credits{font-family:Arial,sans-serif;font-size:14px;color:#333;line-height:1.5}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:28px;font-weight:bold;padding:12px 26px;border-radius:14px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

/* ===== 手機／iPad 優化 ===== */
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none}
img,svg{-webkit-touch-callout:none}
/* iOS：輸入框若設為 user-select:none 會無法打字，必須明確容許 */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.tab,.tool,.cat,.btn,#keypad button,.card{touch-action:manipulation}
.card{touch-action:none}
@media (pointer:coarse){
  .tab{padding:12px 22px}
  .tool{padding:12px 16px}
  .cat{padding:11px 0}
  .btn{padding:13px 20px}
}
/* 螢幕較細（縮放比例低於 0.72）：放大文字及按鈕，方便手指點按 */
body.sm #topbar h1{display:none}
body.sm .tab{font-size:30px;padding:10px 24px}
body.sm .tool{font-size:25px;padding:10px 16px}
body.sm .cat{font-size:26px;padding:12px 0}
body.sm .card span{font-size:27px}
body.sm #shelfHint{font-size:21px}
body.sm #status{font-size:34px}
body.sm #eq{font-size:44px}
body.sm #result{font-size:38px}
body.sm #panel h2{font-size:32px}
body.sm .btn{font-size:30px;padding:14px 22px}
body.sm .steps li{font-size:27px}
body.sm .hint{font-size:28px}
body.sm .small{font-size:24px}
body.sm #keypad{gap:8px}
body.sm #keypad button{height:66px;font-size:36px}
body.sm #keypad button.k2{font-size:26px}
body.sm #ansBox{font-size:44px}
body.sm .sheet h2{font-size:38px}
body.sm table.rec{font-size:30px}
body.sm .set-grid label{font-size:26px}
body.sm .set-grid input{font-size:26px;width:100px}
body.sm #toast{font-size:32px}
body.sm .lockbox .lt{font-size:30px}
/* 直向提示 */
#rot{position:fixed;inset:0;z-index:999;background:#20253a;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-family:var(--kai);padding:24px}
#rot.on{display:flex}
#rot .phone{width:54px;height:92px;border:5px solid var(--gold);border-radius:12px;margin:0 auto 24px;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot p{font-size:24px;line-height:1.5;margin:0 0 8px;font-weight:bold}
#rot small{display:block;font-size:17px;color:#c9cde0;margin-bottom:22px}
#rot button{font-family:var(--kai);font-size:20px;font-weight:bold;padding:12px 24px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="topbar">
    <h1>天平量度重量（克）</h1>
    <button class="tab" data-mode="guess">猜一猜</button>
    <button class="tab on" data-mode="free">自由量度</button>
    <button class="tab" data-mode="guide">引導量度</button>
    <button class="tab" data-mode="pack">包裝淨重</button>
    <div class="spacer"></div>
    <button class="tool" id="bRecord">記錄表</button>
    <button class="tool" id="bShowW">顯示重量</button>
    <button class="tool" id="bSet">設定</button>
    <button class="tool" id="bFull">全螢幕</button>
  </div>
  <div id="shelf">
    <div id="cats">
      <button class="cat on" data-cat="food">食品</button>
      <button class="cat" data-cat="stat">文具</button>
      <button class="cat" data-cat="daily">日用品</button>
    </div>
    <div id="grid"></div>
    <div id="shelfHint">撳一下物件，或把物件拖到托盤上。</div>
  </div>
  <svg id="bg" viewBox="0 0 1300 830"></svg>
  <svg id="fg" viewBox="0 0 1300 830"></svg>
  <div id="side"><div id="hud"><div id="status"></div><div id="eq"></div><div id="result"></div></div>
  <div id="panel"></div></div>
  <div id="packs"></div>
  <div class="modal" id="mRecord"><div class="sheet"><h2>量度記錄表</h2>
    <table class="rec"><thead><tr><th>物件</th><th>砝碼＋砝碼＝重量</th><th>物件重量</th></tr></thead><tbody id="recBody"></tbody></table>
    <div style="margin-top:14px"><button class="btn cor" id="recClear">清除記錄</button><button class="btn" data-close>關閉</button></div></div></div>
  <div class="modal" id="mSet"><div class="sheet"><h2>設定</h2>
    <div id="setLocked" class="lockbox"><div class="lt">物件重量設定　（老師專用）</div>
      <p class="small">物件的重量已隱藏。要查看或修改重量，請輸入老師密碼。</p>
      <button class="btn" id="setUnlock">輸入密碼</button><button class="btn cor" data-close>關閉</button></div>
    <div id="setOpen" style="display:none"><h2 style="font-size:28px">設定物件重量（克）</h2>
    <p class="small">可按課室實物的重量修改，須為 1 至 999 克的整數。砝碼可以重複使用，所以任何整數重量都可以量度。修改會儲存在這部電腦的瀏覽器內。</p>
    <div class="set-grid" id="setGrid"></div>
    <div class="hint" id="setErr"></div>
    <button class="btn" id="setSave">儲存</button><button class="btn alt" id="setReset">還原預設</button><button class="btn cor" data-close>取消</button></div>
    <h2 style="margin-top:20px;font-size:28px">相片來源及授權</h2><div id="credits"></div>
  </div></div>
  <div class="modal" id="mPwd" style="z-index:60"><div class="sheet" style="width:560px;max-width:92%"><h2>請輸入密碼</h2>
    <p class="small" id="pwdMsg">此操作只供老師使用。</p>
    <input type="password" id="pwdIn" autocomplete="off" style="font-size:30px;padding:10px 14px;width:100%;box-sizing:border-box;border-radius:10px;border:3px solid var(--navy)">
    <div class="hint" id="pwdErr" style="min-height:30px"></div>
    <button class="btn" id="pwdOk">確定</button><button class="btn cor" id="pwdNo">取消</button>
  </div></div>
  <div id="toast"></div>
</div></div>

<div id="rot"><div><div class="phone"></div><p>請將裝置橫向放置</p><small>橫向時畫面會更大，天平和砝碼更容易操作。</small><button id="rotGo">仍然直向使用</button></div></div>

/* ---------- 縮放舞台 ---------- */
const stage=$('#stage');

function fit(){
  const w=innerWidth,h=innerHeight;
  const ae=document.activeElement;
  // 手機鍵盤彈出時（只有高度縮短），保持原有大小，避免畫面忽然縮細
  if(ae&&ae.tagName==='INPUT'&&w===_fw&&scale>0)return;
  _fw=w;
  scale=Math.min(w/1600,h/900);
  stage.style.transform=`scale(${scale})`;stage.style.left=((w-1600*scale)/2)+'px';stage.style.top=((h-900*scale)/2)+'px';
  document.body.classList.toggle('sm',scale<0.72);
  const portrait=h>w;
  if(!portrait)rotDismissed=false;
  $('#rot').classList.toggle('on',portrait&&!rotDismissed);
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>{setTimeout(fit,200);setTimeout(fit,600);});

document.addEventListener('fullscreenchange',()=>setTimeout(fit,100));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(fit,100));

const BOX={x:372,y:664,w:440,top:50,front:46}; // 砝碼盒
const slotX={};
(function layoutSlots(){let x=BOX.x+40;const gap=18;WEIGHTS.forEach(w=>{const d=WDIM[w][0]*WK;slotX[w]=x+d/2;x+=d+gap;});const used=x-gap-(BOX.x+40);const off=(BOX.w-80-used)/2;WEIGHTS.forEach(w=>slotX[w]+=off);})();

  el('ellipse',{cx:C,cy:G+4,rx:300,ry:20,fill:'#000',opacity:.42,filter:'url(#blur12)'},bg);
  el('ellipse',{cx:C,cy:G,rx:280,ry:8,fill:'#000',opacity:.35,filter:'url(#blur3)'},bg);
  const bx=C-270,bw=540,bt=G-64,bf=G-40;
  // 頂面（略為俯視）
  el('path',{d:`M${bx+28},${bt} L${bx+bw-28},${bt} Q${bx+bw-6},${bt} ${bx+bw},${bf} L${bx},${bf} Q${bx+6},${bt} ${bx+28},${bt} Z`,fill:'url(#redTop)'},bg);

/* ---------- 物理及繪畫 ---------- */
function massOf(arr){return arr.reduce((s,o)=>s+(o.kind==='w'?o.id:byId[o.id].g),0);}

  const diff=massOf(S.L)-massOf(S.R);
  if(diff===0) return 0;
  const m=Math.min(1,0.22+Math.abs(diff)/45);
  return Math.sign(diff)*MAXDEG*m;

function panPos(side){
  const s=side==='L'?-1:1;const a=-S.theta*Math.PI/180;

}
function layoutPan(side){
  // 回傳每件東西在托盤上的位置（相對托盤面中心）
  const arr=S[side];const res=[];
  const objs=arr.filter(o=>o.kind==='item'), ws=arr.filter(o=>o.kind==='w').sort((a,b)=>b.id-a.id);
  if(objs.length===1){res.push({o:objs[0],x:0,y:0});}
  else if(objs.length>1){const n=objs.length;objs.forEach((o,i)=>res.push({o,x:(i-(n-1)/2)*70,y:0}));}
  if(ws.length){
    // 大砝碼放後排，小砝碼放前排，全部都看得見
    const gap=6;const rows=[[]];let fw=0;
    ws.forEach(o=>{const wd=inst[o.uid].d;if(fw+wd>215&&rows[rows.length-1].length){rows.push([]);fw=0;}rows[rows.length-1].push(o);fw+=wd+gap;});
    const n=rows.length;
    rows.forEach((row,ri)=>{const tot=row.reduce((s,o)=>s+inst[o.uid].d,0)+gap*(row.length-1);let x=-tot/2;const fromFront=n-1-ri;
      row.forEach((o,ci)=>{const wd=inst[o.uid].d;res.push({o,x:x+wd/2,y:2-9*fromFront,back:fromFront>0,fromFront,ci});x+=wd+gap;});});
  }
  return res;
}
let lastT=performance.now();
function frame(t){
  const dt=Math.min(0.033,(t-lastT)/1000);lastT=t;
  const tgt=targetDeg();
  const Kp=38, D=4.2;
  S.omega+=(-Kp*(S.theta-tgt)-D*S.omega)*dt;
  S.theta+=S.omega*dt;
  if(S.theta>MAXDEG+2){S.theta=MAXDEG+2;S.omega*=-0.3;} if(S.theta<-MAXDEG-2){S.theta=-MAXDEG-2;S.omega*=-0.3;}
  beam.setAttribute('transform',`rotate(${-S.theta} ${C} ${P})`);
  const na=Math.max(-DIAL_A,Math.min(DIAL_A,-S.theta*GAIN));
  needle.setAttribute('transform',`rotate(${na} ${C} ${P})`);
  ['L','R'].forEach(side=>{
    const p=panPos(side);const tr=`translate(${p.x},${p.y})`;
    pans[side].back.setAttribute('transform',tr);pans[side].front.setAttribute('transform',tr);
    const surf={x:p.x,y:p.y-RIM+3};
    const lay=layoutPan(side);const maxH=Math.max(0,...lay.filter(r=>r.o.kind==='w').map(r=>inst[r.o.uid].h));
    lay.forEach(({o,x,y,fromFront,ci})=>{
      const e=o.kind==='w'?inst[o.uid]:objEls[o.id];
      if(!e) return;
      if(o.kind==='w'){const up=e.h-maxH-(ci%2?32:0)-fromFront*66;if(e.tagUp!==up){e.tagUp=up;e.tag.setAttribute('transform',`translate(0,${up})`);}}
      if(e.fly) return;
      e.x=surf.x+x;e.y=surf.y+y;
    });
  });
  const now=performance.now();
  [...Object.values(inst),...Object.values(objEls)].forEach(e=>{
    if(e.fly){const f=e.fly;let k=Math.min(1,(now-f.t0)/f.dur);const kk=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const dest=f.dest();e.x=f.x0+(dest.x-f.x0)*kk;e.y=f.y0+(dest.y-f.y0)*kk-Math.sin(Math.PI*kk)*f.arc;
      if(k>=1){e.fly=null;f.done&&f.done();}}
    e.el.setAttribute('transform',`translate(${e.x},${e.y})`);
  });
  Object.values(inst).forEach(e=>{e.tag.setAttribute('opacity',e.where==='R'||e.where==='L'?1:0);});
  checkSettle(dt);
  requestAnimationFrame(frame);
}

/* ---------- 排列圖層次序 ---------- */
function reorder(){
  // 盒內砝碼 → 托盤後排砝碼 → 物件 → 托盤前排砝碼
  const list=WEIGHTS.map(g=>WT[g].el);
  const lays=['L','R'].map(side=>layoutPan(side).filter(r=>r.o.kind==='w'));
  const maxRow=Math.max(0,...lays.flat().map(r=>r.fromFront));
  for(let ff=maxRow;ff>=1;ff--)lays.forEach(l=>l.filter(r=>r.fromFront===ff).forEach(r=>list.push(inst[r.o.uid].el)));
  Object.values(objEls).forEach(e=>{if(e.where)list.push(e.el);});
  lays.forEach(l=>l.filter(r=>r.fromFront===0).forEach(r=>list.push(inst[r.o.uid].el)));
  Object.values(inst).forEach(e=>{if(e.where==='flying')list.push(e.el);});
  list.forEach(n=>layerContents.appendChild(n));
}

    else if(drag.kind==='w'){const side=drag.orig;S[side]=S[side].filter(o=>o.uid!==drag.e.uid);drag.e.where='drag';onChange({type:'lift',w:drag.e.g});}
    else {const side=drag.orig;S[side]=S[side].filter(o=>!(o.kind==='item'&&o.id===drag.id));drag.e.where='drag';onChange({type:'lift'});}

function endDrag(ev){

      const e=d.e;flyTo(e,()=>{const s=panSurface(okSide);return {x:s.x,y:s.y};},()=>{},20);S.omega+=(okSide==='L'?1:-1)*6;onChange({type:'item',id:d.id,side:okSide});}

const statusEl=$('#status'),eqEl=$('#eq'),resEl=$('#result');
function setStatus(html){if(statusEl.innerHTML!==html)statusEl.innerHTML=html;}
function weightsOn(side){return S[side].filter(o=>o.kind==='w').map(o=>o.id).sort((a,b)=>b-a);}
function itemOn(side){const o=S[side].find(o=>o.kind==='item');return o?byId[o.id]:null;}
let eqTimers=[];
function showEquation(ws,total,reveal=true){
  eqTimers.forEach(clearTimeout);eqTimers=[];
  if(!ws.length){eqEl.innerHTML='';return;}
  const parts=[];ws.forEach((w,i)=>{parts.push(`<span class="p">${i?' ＋ ':''}${w}</span>`);});
  parts.push(`<span class="p tot"> ＝ ${reveal?total:'？'}</span>`);
  eqEl.innerHTML=parts.join('');eqEl.style.fontSize=(ws.length<=3?40:ws.length===4?34:28)+'px';
  const ps=eqEl.querySelectorAll('.p');ps.forEach((p,i)=>eqTimers.push(setTimeout(()=>p.classList.add('show'),250+i*650)));
  return 250+ps.length*650;
}
function clearEq(){eqTimers.forEach(clearTimeout);eqEl.innerHTML='';resEl.innerHTML='';}

function onChange(ev){S.settleT=0;S.balancedFired=false;S.reported=null;
  if(S.mode==='guide')guideOnChange(ev);
  clearEq();
}
function checkSettle(dt){
  if(Math.abs(S.omega)<1.2&&Math.abs(S.theta-targetDeg())<0.6) S.settleT+=dt; else S.settleT=0;
  const settled=S.settleT>0.5;
  setLamp(settled&&!S.locked&&S.L.length>0&&S.R.length>0&&massOf(S.L)===massOf(S.R));
  updateStatus(settled);
}
function updateStatus(settled){
  if(S.mode==='pack')return;
  const it=itemOn('L');const ws=weightsOn('R');
  const mL=massOf(S.L),mR=massOf(S.R);
  if(S.mode==='guess'){guessStatus(settled);return;}
  if(!it){setStatus('把物件放在<b>左邊</b>托盤上。');return;}
  if(!ws.length){setStatus(`在<b>右邊</b>托盤放上砝碼，量度${it.name}有多重。`);return;}
  if(!settled){setStatus('看一看天平……');return;}
  S.lastKind=mL===mR?'bal':(mL>mR?'heavy':'light');
  if(mL===mR){
    if(!S.balancedFired){S.balancedFired=true;onBalanced(it,ws,mR);}
  } else if(mL>mR){setStatus(`<span class="warn">左邊較低：${it.name}較重。</span><br>要再加砝碼。`);if(S.mode==='guide')guideOnSettled('heavy');}
  else {setStatus(`<span class="warn">右邊較低：砝碼較重。</span><br>要換小一點的砝碼。`);if(S.mode==='guide')guideOnSettled('light');}
}
function onBalanced(it,ws,total){
  setStatus(`<span class="ok">天平平衡！兩邊一樣重。</span><br>${it.name}的重量 ＝ 砝碼加起來`);
  if(S.mode==='free'){
    const t=showEquation(ws,total,true);
    eqTimers.push(setTimeout(()=>{resEl.textContent=`${it.name}重 ${total} 克`;},t));
    addRecord(it,ws,total);
  } else if(S.mode==='guide'){guideBalanced(it,ws,total);}
}
function addRecord(it,ws,total){
  const f=ws.join(' ＋ ')+' ＝ '+total;
  const ex=S.records.find(r=>r.name===it.name);
  if(ex){ex.f=f;ex.total=total;} else S.records.push({name:it.name,f,total});
}

function guessStatus(settled){

function panelGuide(){resetGuideState();renderGuide();}

function renderGuide(){

  const st=['① 把物件放在左邊托盤。','② 先試最大的砝碼；太重，就換小一點的。','③ 再逐個加小砝碼，直至天平平衡。','④ 把砝碼的重量加起來。'];

function resetGuideState(){S.guide={item:null,rejected:[],lastG:null,lastUid:null,step:1,answered:false,input:'',hint:''};}
function highlight(){
  WEIGHTS.forEach(w=>WT[w].glow.setAttribute('opacity',0));
  if(S.mode!=='guide')return;
  const gd=S.guide;if(!itemOn('L')||gd.step>=4)return;
  const c=nextCandidate();if(c)WT[c].glow.setAttribute('opacity',1);
}
function guideOnChange(ev){
  const gd=S.guide;
  if(ev.type==='item'&&ev.side==='L'){resetGuideState();S.guide.item=ev.id;S.guide.step=2;S.guide.hint=`先試最大的砝碼：${nextCandidate()} g。`;}
  else if(ev.type==='itemOut'){resetGuideState();}
  else if(ev.type==='add'){
    const c=nextCandidate();
    if(!itemOn('L')){gd.hint='先把物件放在左邊托盤。';}
    else{gd.hint=(c&&ev.w!==c)?`提示：應先試 ${c} g（由大至小逐個試）。`:'看一看天平……';gd.lastG=ev.w;gd.lastUid=ev.uid;}
  }
  else if(ev.type==='remove'||ev.type==='lift'){
    // 拿走「太重」的砝碼：保留已試結果；拿走其他砝碼：重新由大至小試
    if(!(S.lastKind==='light'&&ev.w===gd.lastRejected))gd.rejected=[];
    const c=nextCandidate();if(itemOn('L'))gd.hint=c?`再試 ${c} g 的砝碼。`:'';
  }
  gd.answered=false;gd.input='';
  if(gd.step===4)gd.step=3;
  renderGuide();
}
function guideOnSettled(kind){
  const gd=S.guide;if(S.reported===kind)return;S.reported=kind;
  if(kind==='light'){ // 砝碼太重
    const onR=gd.lastUid&&inst[gd.lastUid]&&inst[gd.lastUid].where==='R';
    // 這個砝碼太重，比它更重的砝碼一定也太重
    if(onR){WEIGHTS.forEach(w=>{if(w>=gd.lastG&&!gd.rejected.includes(w))gd.rejected.push(w);});gd.lastRejected=gd.lastG;}
    const c=nextCandidate();
    gd.hint=onR?`砝碼太重了！把 ${gd.lastG} g 拿走，再試${c?` ${c} g`:'小一點的砝碼'}。`:'砝碼太重了，拿走一個砝碼。';
    gd.step=2;
  } else {
    const c=nextCandidate();const nm=byId[gd.item]?byId[gd.item].name:'物件';
    const kept=weightsOn('R').length;
    gd.hint=kept?`${nm}仍然較重。保留砝碼，再加${c===gd.lastG?'一個':''} ${c} g。`:`先試最大的砝碼：${c} g。`;

  }

function guideBalanced(it,ws,total){

function keyIn(k){

      showEquation(ws,total,true);resEl.textContent=`${it.name}重 ${total} 克`;addRecord(it,ws,total);WEIGHTS.forEach(w=>WT[w].glow.setAttribute('opacity',0));}

    <path d="M${-W/2+30},${-H+40} Q${-W/2+40},${-H/2} ${-W/2+28},-40" stroke="#fff" stroke-opacity=".35" stroke-width="6" fill="none"/>`;
    if(p.win==='nut'&&ASSETS.nutwin){body+=`<ellipse cx="0" cy="${-H*0.42}" rx="62" ry="58" fill="#f3ead8" stroke="#fff" stroke-width="4"/><image href="${ASSETS.nutwin}" x="-55" y="${-H*0.42-50}" width="110" height="100"/>`;}
    else {body+=`<ellipse cx="0" cy="${-H*0.42}" rx="64" ry="50" fill="#fff" opacity=".85"/><ellipse cx="0" cy="${-H*0.42}" rx="52" ry="38" fill="${p.c2}" opacity=".5"/>`;}
    labelX=W/2-92;labelY=-62;
  } else if(p.type==='box'){W=190;H=250;const D=34;
    body=`<path d="M${-W/2},${-H} L${-W/2+D},${-H-D*0.6} L${W/2+D},${-H-D*0.6} L${W/2},${-H} Z" fill="${p.c2}"/>
    <path d="M${W/2},${-H} L${W/2+D},${-H-D*0.6} L${W/2+D},${-D*0.6} L${W/2},0 Z" fill="url(#${id}s)"/>
    <rect x="${-W/2}" y="${-H}" width="${W}" height="${H}" fill="${p.color}"/>
    <rect x="${-W/2}" y="${-H}" width="${W*0.35}" height="${H}" fill="#fff" opacity=".12"/>
    <rect x="${-W/2+14}" y="${-H*0.62}" width="${W-28}" height="80" rx="10" fill="#fff" opacity=".9"/>
    <circle cx="${-30}" cy="${-H*0.62+40}" r="22" fill="${p.c2}"/><circle cx="${12}" cy="${-H*0.62+40}" r="22" fill="${p.c2}" opacity=".7"/><circle cx="${52}" cy="${-H*0.62+40}" r="22" fill="${p.c2}" opacity=".45"/>`;
    labelX=W/2-92;labelY=-50;
  } else { W=300;H=110;
    body=`<path d="M${-W/2},${-H+6} L${-W/2+14},${-H} L${W/2-14},${-H} L${W/2},${-H+6} L${W/2},-6 L${W/2-14},0 L${-W/2+14},0 L${-W/2},-6 Z" fill="url(#${id})"/>
    <rect x="${-W/2+18}" y="${-H}" width="5" height="${H}" fill="#000" opacity=".2"/><rect x="${W/2-23}" y="${-H}" width="5" height="${H}" fill="#000" opacity=".2"/>
    <rect x="${-W/2+40}" y="${-H+18}" width="${W-80}" height="10" fill="#d4a017"/>`;
    labelX=W/2-100;labelY=-36;
  }
  const nameY=p.type==='bar'?-H+70:(p.type==='box'?-H+48:-H+70);
  const nameEl=`<text x="${p.type==='bar'?-80:0}" y="${nameY}" text-anchor="middle" font-size="${p.type==='bar'?36:46}" font-weight="bold" fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width="2.5" paint-order="stroke" font-family="DFKai-SB,BiauKai,Kaiti TC,STKaiti,serif">${p.name}</text>`;
  const rev=PK.revealed;
  const label=`<g transform="translate(${labelX},${labelY})"><g class="lbl" style="transform-origin:42px 13px;transition:transform .6s;transform:scale(${rev?1.55:1})">
     <rect x="0" y="0" width="84" height="26" rx="3" fill="#fff" stroke="#333" stroke-width="1"/>
     <text x="42" y="19" text-anchor="middle" font-size="16" font-weight="bold" fill="#111" font-family="Arial,Helvetica,sans-serif">淨重 ${p.net} g</text>
     ${rev?'<ellipse cx="42" cy="13" rx="58" ry="24" fill="none" stroke="#e53935" stroke-width="4"/>':''}</g>
     ${rev?'':`<circle cx="42" cy="13" r="30" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/><text x="42" y="24" text-anchor="middle" font-size="30" font-weight="bold" fill="#5d4037" font-family="Arial">?</text>`}</g>`;
  const badge=PK.seq.includes(i)?`<g transform="translate(0,${-H-40})"><circle r="30" fill="${PK.checked?(seqOk()?'#2e8b3e':'#c62828'):'#1E2761'}"/><text y="12" text-anchor="middle" font-size="34" font-weight="bold" fill="#fff" font-family="Arial">${PK.seq.indexOf(i)+1}</text></g>`:'';
  const guessTag=PK.guess===i?`<g transform="translate(0,${-H-(PK.seq.includes(i)?96:40)})"><rect x="-78" y="-26" width="156" height="38" rx="10" fill="#F9E795" stroke="#1E2761" stroke-width="2"/><text y="2" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E2761" font-family="DFKai-SB,BiauKai,Kaiti TC,STKaiti,serif">我估最重</text></g>`:'';
  return `<defs>${defs}</defs><g class="pk" data-i="${i}" style="cursor:pointer" transform="translate(${x},${PBASE+lift})">
    <ellipse cx="${p.type==='box'?14:0}" cy="${-lift+2}" rx="${W*0.6}" ry="16" fill="#000" opacity=".35" filter="url(#blur6)"/>
    ${body}${nameEl}${label}${badge}${guessTag}</g>`;
}
function seqOk(){if(PK.seq.length<3)return false;const n=PK.seq.map(i=>PK.order[i].net);return n[0]<n[1]&&n[1]<n[2];}
function renderPack(){
  const box=$('#packs');
  const step=!PK.revealed?(PK.guess===null?1:2):3;
  let msg='';
  if(step===1)msg='① 拿起食物，先估一估：哪一包最重？（撳一下包裝）';
  else if(step===2)msg='② 再看包裝上的「淨重」，看看估得準不準。';
  else if(PK.seq.length<3)msg='③ 由輕至重排列：順序撳一下最輕、較重、最重的包裝。';
  else if(!PK.checked)msg='③ 排好了！撳「核對」。';
  else msg=seqOk()?'排列正確！':'排列不正確，撳「重新排列」再試一次。';
  let res='';
  if(PK.revealed&&PK.guess!==null){const max=Math.max(...PK.order.map(p=>p.net));const g=PK.order[PK.guess];res=g.net===max?`估得準！${g.name}最重（${g.net}克）。`:`${PK.order.find(p=>p.net===max).name}才是最重（${max}克）。`;}
  let order='';
  if(PK.checked&&seqOk())order=PK.seq.map(i=>`${PK.order[i].name}（${PK.order[i].net}克）`).join('、');
  box.innerHTML=`<svg viewBox="-150 0 1600 830" width="1600" height="830"><defs>${bg.querySelector('defs').innerHTML}</defs>
   <rect x="-150" width="1600" height="470" fill="url(#wall)"/><rect x="-150" width="1600" height="470" fill="url(#light)"/><rect x="-150" y="452" width="1600" height="18" fill="#bfb39b"/>
   <rect x="-150" y="470" width="1600" height="300" fill="url(#tableTop)"/><rect x="-150" y="470" width="1600" height="300" filter="url(#grain)" opacity=".75"/><rect x="-150" y="470" width="1600" height="300" filter="url(#grain2)" opacity=".5"/>
   <rect x="-150" y="770" width="1600" height="60" fill="url(#tableEdge)"/>
   ${PK.order.map((p,i)=>packSVG(p,i)).join('')}</svg>
   <div style="position:absolute;left:24px;top:18px;width:1552px;background:rgba(255,255,255,.93);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:12px 20px;border-left:10px solid var(--coral)">
     <div style="font-size:30px;font-weight:bold;color:var(--navy)">包裝上「淨重」後面的數字，就是食物的重量。</div>
     <div style="font-size:28px;font-weight:bold;color:#c62828;margin-top:6px">${msg}</div>
     <div style="font-size:28px;font-weight:bold;color:#2e7d32;min-height:0">${res}${order?'<br>由輕至重：'+order:''}</div>
     <div style="margin-top:6px">
       <button class="btn gold" id="pkReveal" ${PK.revealed?'disabled':''}>看淨重</button>
       <button class="btn" id="pkCheck" ${PK.seq.length===3&&!PK.checked?'':'disabled'}>核對</button>
       <button class="btn alt" id="pkRe">重新排列</button>
       <button class="btn cor" id="pkNext">下一組</button>
       <span class="small" style="margin-left:10px">第 ${PK.set+1} / ${PACKSETS.length} 組</span></div></div>`;
  box.querySelectorAll('.pk').forEach(g=>g.onclick=()=>{const i=+g.dataset.i;
    if(!PK.revealed){PK.guess=i;}
    else if(!PK.checked&&!PK.seq.includes(i)&&PK.seq.length<3){PK.seq.push(i);}
    renderPack();});
  $('#pkReveal').onclick=()=>{PK.revealed=true;renderPack();};
  $('#pkCheck').onclick=()=>{PK.checked=true;renderPack();};
  $('#pkRe').onclick=()=>{PK.seq=[];PK.checked=false;renderPack();};
  $('#pkNext').onclick=()=>{PK.set=(PK.set+1)%PACKSETS.length;startPack();};
}


/* ---------- 模式切換 ---------- */
function setMode(m){
  S.mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
  clearPans();clearEq();S.locked=false;S.reported=null;S.balancedFired=false;
  WEIGHTS.forEach(w=>WT[w].glow.setAttribute('opacity',0));
  Object.values(objEls).forEach(e=>e.tag.setAttribute('opacity',0));
  const isPack=m==='pack';
  $('#packs').style.display=isPack?'block':'none';
  ['#fg','#hud','#panel'].forEach(s=>$(s).style.display=isPack?'none':'');
  $('#shelf').style.visibility=isPack?'hidden':'visible';
  if(m==='free')panelFree();else if(m==='guess')panelGuess();else if(m==='guide')panelGuide();else if(m==='pack')startPack();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));

/* ---------- 工具 ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}
/* ---------- 老師密碼 ---------- */
const PWD_B64="a29zMTIzNDU2";
let _pwdCb=null;
function askPwd(msg,cb){_pwdCb=cb;$('#pwdMsg').textContent=msg;$('#pwdIn').value='';$('#pwdErr').textContent='';$('#mPwd').classList.add('on');setTimeout(()=>$('#pwdIn').focus(),50);}
function pwdSubmit(){if($('#pwdIn').value===atob(PWD_B64)){$('#mPwd').classList.remove('on');const f=_pwdCb;_pwdCb=null;if(f)f();}else{$('#pwdErr').textContent='密碼不正確，請再試。';$('#pwdIn').value='';$('#pwdIn').focus();}}
$('#pwdOk').onclick=pwdSubmit;
$('#pwdIn').addEventListener('keydown',e=>{if(e.key==='Enter')pwdSubmit();e.stopPropagation();});
$('#pwdNo').onclick=()=>{_pwdCb=null;$('#mPwd').classList.remove('on');};
function toggleShowW(){document.body.classList.toggle('showw');const on=document.body.classList.contains('showw');$('#bShowW').textContent=on?'隱藏重量':'顯示重量';
  Object.values(objEls).forEach(e=>e.tag.setAttribute('opacity',on?1:0));toast(on?'已顯示物件重量（教師用）':'已隱藏物件重量');}
$('#bShowW').onclick=()=>{if(document.body.classList.contains('showw'))toggleShowW();else askPwd('顯示重量須輸入老師密碼。',toggleShowW);};
const _de=document.documentElement,_rf=_de.requestFullscreen||_de.webkitRequestFullscreen;
if(!_rf)$('#bFull').style.display='none'; // iPhone 等不支援全螢幕的裝置：隱藏按鈕，建議「加入主畫面」
$('#bFull').onclick=()=>{
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!fs){try{const pr=_rf.call(_de);if(pr&&pr.then)pr.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
  else{try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}}
};
$('#bRecord').onclick=()=>{const tb=$('#recBody');tb.innerHTML=S.records.length?S.records.map(r=>`<tr><td>${r.name}</td><td class="f">${r.f}</td><td>${r.total} 克</td></tr>`).join(''):'<tr><td colspan="3">未有記錄。天平平衡後會自動記錄。</td></tr>';$('#mRecord').classList.add('on');};
$('#recClear').onclick=()=>{S.records=[];$('#bRecord').onclick();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
function buildSetGrid(){$('#setGrid').innerHTML=ITEMS.map(it=>`<label data-id="${it.id}">${it.name}<input type="number" min="1" max="999" value="${it.g}"></label>`).join('');$('#setErr').textContent='';}
$('#bSet').onclick=()=>{
  $('#setLocked').style.display='block';$('#setOpen').style.display='none';$('#setGrid').innerHTML='';
  $('#setErr').textContent='';$('#credits').innerHTML=CREDITS;$('#mSet').classList.add('on');};
$('#setUnlock').onclick=()=>askPwd('查看或修改物件重量須輸入老師密碼。',()=>{buildSetGrid();$('#setLocked').style.display='none';$('#setOpen').style.display='block';});
$('#setSave').onclick=()=>{let bad=[];const o={};document.querySelectorAll('#setGrid label').forEach(l=>{const v=+l.querySelector('input').value;const ok=Number.isInteger(v)&&reachable(v);l.classList.toggle('err',!ok);if(!ok)bad.push(l.textContent.trim());else o[l.dataset.id]=v;});
  if(bad.length){$('#setErr').textContent='以下重量不正確（須為 1 至 999 的整數）：'+bad.join('、');return;}
  ITEMS.forEach(it=>it.g=o[it.id]);try{localStorage.setItem('balanceWeights_v1',JSON.stringify(o));}catch(e){}
  $('#mSet').classList.remove('on');setMode(S.mode);renderShelf();toast('已儲存');};
$('#setReset').onclick=()=>{ITEMS.forEach(it=>it.g=DEFAULT_G[it.id]);try{localStorage.removeItem('balanceWeights_v1');}catch(e){}buildSetGrid();toast('已還原預設重量');};

/* ---------- 開始 ---------- */
loadOverrides();renderShelf();setMode('free');reorder();
requestAnimationFrame(frame);
window.__S=S; // 測試用
</script>
</body>
